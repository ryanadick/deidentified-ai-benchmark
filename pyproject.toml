[project]
name = "deidbench"
version = "0.1.0"
description = "A reproducible benchmark for PHI detection in HL7 v2 messages"
readme = "README.md"
requires-python = ">=3.12"
license = { file = "LICENSE" }
authors = [{ name = "Ryan Dick", email = "ryan@activecrossing.com" }]
keywords = ["hl7", "phi", "de-identification", "benchmark", "health-informatics"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Healthcare Industry",
    "Intended Audience :: Science/Research",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Medical Science Apps.",
]
dependencies = [
    "pyyaml>=6.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
]
# Microsoft Presidio, the published text-only baseline. Optional because the
# three core arms must run with PyYAML alone, and because this extra pulls in
# spaCy and a ~600MB language model.
#
# The upper bounds are not caution, they are a working set. spaCy 3.8 with the
# current murmurhash/preshed/cymem wheels raises OverflowError inside the
# tokenizer on import of any model, so the detector cannot run at all; numpy 2
# breaks the matching thinc build. These pins are the combination verified to
# load en_core_web_lg and produce the committed Presidio figures. The model
# itself is not installable from PyPI -- see the README for the one extra
# command.
# Philter, the second published baseline. This is philter-lite, a BSD fork of
# UCSF's philter-ucsf, and the substitution is forced rather than chosen: 324
# of the 617 regex filter files in the published philter_delta set put an
# inline (?i) flag mid-pattern, which Python has rejected as an error since
# 3.11, so philter-ucsf cannot run on any Python this package supports. The
# fork's patterns are the published ones with the flag relocated, which is
# semantics-preserving; tests/test_philter_baseline.py pins that claim against
# the published filter files. Needs NLTK tagger data -- see the README.
philter = [
    "philter-lite>=0.6,<1.0",
    "nltk>=3.8",
]
presidio = [
    "presidio-analyzer>=2.2,<3.0",
    "spacy==3.7.5",
    "thinc==8.2.5",
    "numpy==1.26.4",
    "murmurhash==1.0.10",
    "preshed==3.0.9",
    "cymem==2.0.8",
    "blis==0.7.11",
    "srsly==2.4.8",
]

[project.urls]
Homepage = "https://github.com/ryanadick/deidentified-ai-benchmark"
Issues = "https://github.com/ryanadick/deidentified-ai-benchmark/issues"

[project.scripts]
deidbench = "deidbench.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/deidbench"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
