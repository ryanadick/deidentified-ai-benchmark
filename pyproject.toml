[project]
name = "deidbench"
version = "0.1.0"
description = "A reproducible benchmark for PHI detection in HL7 v2 messages"
readme = "README.md"
requires-python = ">=3.12"
license = { file = "LICENSE" }
authors = [{ name = "Ryan Dick", email = "ryan@activecrossing.com" }]
keywords = ["hl7", "phi", "de-identification", "benchmark", "health-informatics"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Healthcare Industry",
    "Intended Audience :: Science/Research",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Medical Science Apps.",
]
dependencies = [
    "pyyaml>=6.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
]

[project.urls]
Homepage = "https://github.com/ryanadick/deidentified-ai-benchmark"
Issues = "https://github.com/ryanadick/deidentified-ai-benchmark/issues"

[project.scripts]
deidbench = "deidbench.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/deidbench"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
